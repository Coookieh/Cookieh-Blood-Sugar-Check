<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿瑾的健康助手</title><style>:root{--p:#157766;--bg:#f2f7f6;--ink:#17332e;--muted:#667f7a;--line:#d7e7e3;--lo:#168652;--mi:#b97800;--hi:#c83d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.app{max-width:1100px;margin:auto;padding:16px 16px 90px}.hero{background:linear-gradient(135deg,#116754,#22a092);color:#fff;padding:27px;border-radius:25px}.hero h1{margin:0;font-size:clamp(30px,5vw,46px)}.hero p{margin:8px 0}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;padding:8px;border-radius:17px;margin:15px 0;position:sticky;top:8px;z-index:8;box-shadow:0 8px 22px #17332e18}.nav button,.btn{border:0;border-radius:12px;padding:12px;background:transparent;color:var(--muted);font-weight:750;cursor:pointer}.nav .active,.btn{background:#d9f0ec;color:var(--p)}.page{display:none}.page.active{display:block}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:19px;margin-top:14px}.search{display:grid;grid-template-columns:1fr auto;gap:9px}input{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.filters{display:flex;gap:7px;overflow:auto;padding:13px 0}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;color:var(--muted)}.filter.active{background:#d9f0ec;color:var(--p);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.food{border:1px solid var(--line);border-left:5px solid var(--risk);border-radius:16px;padding:15px}.food h3{margin:7px 0}.risk,.stars{color:var(--risk);font-weight:800}.stars{font-size:23px}.muted{font-size:13px;color:var(--muted);line-height:1.6}.notice{background:#fff7e6;border-left:4px solid #e5a128;border-radius:12px;padding:13px;margin-top:14px;font-size:13px;line-height:1.65}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric,.result{background:#edf8f5;border-radius:14px;padding:13px}.metric b{font-size:22px}.record,.meal-row{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid var(--line);padding:13px 0}.tag{display:inline-block;background:#eef5f3;border-radius:99px;padding:4px 8px;font-size:12px;margin:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:28px}.modal{display:none;position:fixed;inset:0;background:#102c2777;z-index:30;align-items:end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(650px,100%);max-height:88vh;overflow:auto;padding:22px;border-radius:24px 24px 0 0}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}.chart{display:flex;align-items:end;gap:7px;height:130px}.bar{flex:1;min-width:18px;background:linear-gradient(#3ab7a5,#157766);border-radius:7px 7px 2px 2px;position:relative}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}@media(max-width:650px){.app{padding:10px 10px 82px}.nav{position:fixed;left:10px;right:10px;bottom:8px;top:auto}.nav button{font-size:12px}.search,.fields{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app"><header class="hero"><h1>阿瑾的健康助手</h1><p>阿瑾乖宝的健康第一！！</p></header><nav class="nav"><button class="active" data-page="foods">食品查询</button><button data-page="records">餐后血糖记录</button><button data-page="meal">餐食评估</button></nav><section id="foods" class="page active"><div class="panel"><div class="search"><input id="q" placeholder="搜索品牌、单品、可乐、电解质饮料、奶茶、食品……"><button class="btn" id="searchBtn">查询</button></div><div class="filters" id="filters"></div><div class="grid" id="foodList"></div></div><div class="notice"><b>提示：</b>品牌菜单和门店供应会随城市、门店与活动变化；本页收录公开来源中可核实的代表性常驻及近期产品，不承诺所有门店实时在售。请以品牌App或门店当日菜单及营养信息为准。</div></section><section id="records" class="page"><div class="panel"><h2>新增餐后血糖记录</h2><div class="fields"><div class="field"><label>食品或餐食名称</label><input id="rFood" list="foodNames"></div><div class="field"><label>日期和时间</label><input id="rTime" type="datetime-local"></div><div class="field"><label>份量 / 糖度</label><input id="rPortion" placeholder="如：500mL、0糖"></div><div class="field"><label>餐前血糖（mmol/L）</label><input id="rPre" type="number" step="0.1"></div><div class="field"><label>餐后1小时</label><input id="rH1" type="number" step="0.1"></div><div class="field"><label>餐后2小时</label><input id="rH2" type="number" step="0.1"></div><div class="field"><label>备注</label><input id="rNote"></div></div><datalist id="foodNames"></datalist><div class="toolbar"><button class="btn" id="saveRecord">保存记录</button><button class="btn" id="exportBtn">导出备份</button><label class="btn">导入备份<input id="importFile" type="file" accept="application/json" hidden></label></div></div><div class="panel"><h2>个人统计</h2><div class="summary" id="summary"></div><div class="chart" id="chart"></div><div id="foodStats"></div></div><div class="panel"><h2>历史记录</h2><div id="recordList"></div></div></section><section id="meal" class="page"><div class="panel"><h2>组合餐食评估</h2><div class="search"><input id="mealQ" list="foodNames" placeholder="输入食品或饮料"><button class="btn" id="mealAdd">添加</button></div><div id="mealList"></div><div id="mealResult" class="result">尚未添加食品。</div><button class="btn" id="clearMeal" style="margin-top:10px">清空本餐</button></div><div class="notice">组合结果为教育性的相对风险提示，不是个人餐后血糖预测。</div></section></main><div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><div id="details"></div></div></div><script>const foods=[{"name":"橙C美式（瑞幸）","cat":"奶茶咖啡","risk":3,"why":"橙汁或橙味基底中的糖和碳水","tip":"不额外加糖，避免搭配甜点","keys":["橙C","瑞幸","美式"],"id":"f0"},{"name":"兰香青柠（爷爷不泡茶）","cat":"奶茶咖啡","risk":4,"why":"糖浆或果汁基底","tip":"无糖或最低糖、小杯、不加料","keys":["兰香","青柠"],"id":"f1"},{"name":"伯牙绝弦（霸王茶姬）","cat":"奶茶咖啡","risk":4,"why":"奶基底与可能添加的糖","tip":"无糖或最低糖，不加珍珠奶盖","keys":["霸王茶姬"],"id":"f2"},{"name":"多肉葡萄（喜茶）","cat":"奶茶咖啡","risk":5,"why":"果肉、果汁基底和糖浆","tip":"小杯、最低糖，不搭配甜品","keys":["喜茶","葡萄"],"id":"f3"},{"name":"珍珠奶茶","cat":"奶茶咖啡","risk":5,"why":"糖、珍珠淀粉和奶基底","tip":"小杯、最低糖、去珍珠","keys":["奶茶","波霸"],"id":"f4"},{"name":"厚乳拿铁（瑞幸）","cat":"奶茶咖啡","risk":4,"why":"厚乳、乳糖和可能添加的糖","tip":"不另外加糖，不搭配甜面包","keys":["瑞幸","厚乳"],"id":"f5"},{"name":"焦糖玛奇朵","cat":"奶茶咖啡","risk":5,"why":"焦糖糖浆、牛奶和淋酱","tip":"小杯，减少糖浆和淋酱","keys":["星巴克"],"id":"f6"},{"name":"可口可乐","cat":"包装饮料","risk":5,"why":"含糖碳酸饮料中的添加糖","tip":"尽量避免，优先选择无糖版","keys":["可乐","Coca-Cola"],"id":"f7"},{"name":"百事可乐","cat":"包装饮料","risk":5,"why":"含糖碳酸饮料中的添加糖","tip":"尽量避免，优先选择无糖版","keys":["Pepsi","百事"],"id":"f8"},{"name":"可口可乐Zero","cat":"包装饮料","risk":1,"why":"无糖配方，可利用碳水很少","tip":"可替代普通可乐，但日常仍以水为主","keys":["零度","无糖可乐"],"id":"f9"},{"name":"百事无糖","cat":"包装饮料","risk":1,"why":"无糖配方，可利用碳水很少","tip":"可替代普通百事，但仍应适量","keys":["百事0糖"],"id":"f10"},{"name":"东方树叶乌龙茶","cat":"包装饮料","risk":1,"why":"无糖茶饮，可利用碳水很少","tip":"可适量饮用，注意咖啡因","keys":["东方树叶","乌龙茶"],"id":"f11"},{"name":"东方树叶绿茶","cat":"包装饮料","risk":1,"why":"无糖茶饮，可利用碳水很少","tip":"可适量饮用，注意咖啡因","keys":["东方树叶"],"id":"f12"},{"name":"东方树叶茉莉花茶","cat":"包装饮料","risk":1,"why":"无糖茶饮，可利用碳水很少","tip":"可适量饮用，注意咖啡因","keys":["东方树叶","茉莉"],"id":"f13"},{"name":"东方树叶红茶","cat":"包装饮料","risk":1,"why":"无糖茶饮，可利用碳水很少","tip":"可适量饮用，注意咖啡因","keys":["东方树叶"],"id":"f14"},{"name":"元气森林气泡水","cat":"包装饮料","risk":1,"why":"无糖气泡饮料","tip":"可替代含糖汽水，日常仍以水为主","keys":["元气森林","气泡水"],"id":"f15"},{"name":"元气森林燃茶","cat":"包装饮料","risk":1,"why":"无糖茶饮","tip":"适量饮用，注意咖啡因","keys":["燃茶"],"id":"f16"},{"name":"茶π","cat":"包装饮料","risk":5,"why":"常规含糖茶饮","tip":"减少饮用，查看具体口味营养标签","keys":["茶派","农夫山泉"],"id":"f17"},{"name":"农夫山泉NFC橙汁","cat":"包装饮料","risk":4,"why":"果汁中的天然糖，缺少整果纤维结构","tip":"小份饮用，不替代整果","keys":["NFC" sc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function page(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==id))}function filters(){$('#filters').innerHTML=cats.map(c=>`<button class="filter ${c==activeCat?'active':''}" data-c="${c}">${c}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{activeCat=b.dataset.c;filters();render()})}function match(f,q){return[f.name,f.cat,f.why,...f.keys].join(' ').toLowerCase().includes(q.toLowerCase())}function render(){let q=$('#q').value.trim(),a=foods.filter(f=>(activeCat=='全部'||f.cat==activeCat)&&(!q||match(f,q)));$('#foodList').innerHTML=a.length?a.map(f=>`<article class="food" style="--risk:${color(f.risk)}"><div class="risk">${riskText[f.risk]}升糖风险</div><h3>${esc(f.name)}</h3><div class="stars">${'★'.repeat(f.risk)}<span style="color:#dce5e3">${'★'.repeat(5-f.risk)}</span></div><p class="muted">${esc(f.why)}</p><button class="btn" onclick="detail('${f.id}')">详情 / 操作</button></article>`).join(''):'<div class="empty">未找到匹配项目。</div>'}function detail(id){let f=foods.find(x=>x.id==id);$('#details').innerHTML=`<div class="risk" style="--risk:${color(f.risk)}">${riskText[f.risk]}升糖风险</div><h2>${esc(f.name)}</h2><h3>主要风险来源</h3><p>${esc(f.why)}</p><h3>更稳妥的选择</h3><p>${esc(f.tip)}</p><div class="toolbar"><button class="btn" onclick="startRecord('${id}')">记录餐后血糖</button><button class="btn" onclick="addMeal('${id}')">加入本餐</button></div>`;$('#modal').classList.add('show')}function startRecord(id){$('#rFood').value=foods.find(x=>x.id==id).name;$('#modal').classList.remove('show');page('records')}function recs(){try{return JSON.parse(localStorage.getItem('ajin_glucose_records')||'[]')}catch{return[]}}function save(a){localStorage.setItem('ajin_glucose_records',JSON.stringify(a))}function delta(v){return(v>=0?'+':'')+v.toFixed(1)+' mmol/L'}function saveRec(){let pre=+$rPre.value,h1=+$rH1.value,h2=+$rH2.value;if(!$rFood.value.trim()||!$rTime.value||![pre,h1,h2].every(v=>v>0)){alert('请完整填写食品、时间和三项血糖值。');return}let a=recs();a.push({id:Date.now(),food:$rFood.value.trim(),time:$rTime.value,portion:$rPortion.value.trim(),pre,h1,h2,note:$rNote.value.trim()});save(a);renderRec()}function renderRec(){let a=recs().sort((x,y)=>y.time.localeCompare(x.time)),avg=k=>a.length?a.reduce((s,r)=>s+r[k],0)/a.length:0;$('#summary').innerHTML=`<div class="metric">记录次数<br><b>${a.length}</b></div><div class="metric">平均餐前<br><b>${avg('pre').toFixed(1)}</b></div><div class="metric">平均1小时升幅<br><b>${a.length?(avg('h1')-avg('pre')).toFixed(1):'0.0'}</b></div><div class="metric">平均2小时升幅<br><b>${a.length?(avg('h2')-avg('pre')).toFixed(1):'0.0'}</b></div>`;$('#recordList').innerHTML=a.length?a.map(r=>`<div class="record"><div><b>${esc(r.food)}</b><span class="tag">${new Date(r.time).toLocaleString()}</span><div class="muted">餐前 ${r.pre.toFixed(1)}　1小时 ${r.h1.toFixed(1)}（${delta(r.h1-r.pre)}）　2小时 ${r.h2.toFixed(1)}（${delta(r.h2-r.pre)}）</div></div><button class="btn" onclick="delRec(${r.id})">删除</button></div>`).join(''):'<div class="empty">还没有记录。</div>';let recent=a.slice(0,10).reverse(),max=Math.max(15,...recent.map(r=>r.h1));$('#chart').innerHTML=recent.map(r=>`<div class="bar" style="height:${Math.max(10,r.h1/max*100)}%"><span>${r.h1.toFixed(1)}</span></div>`).join('');let g={};a.forEach(r=>(g[r.food]??=[]).push(r));$('#foodStats').innerHTML=Object.entries(g).map(([n,v])=>`<div class="record"><div><b>${esc(n)}</b><div class="muted">${v.length}次 · 平均1小时升幅 ${delta(v.reduce((s,x)=>s+x.h1-x.pre,0)/v.length)}</div></div></div>`).join('')}function delRec(id){save(recs().filter(r=>r.id!=id));renderRec()}function addMeal(id){let f=foods.find(x=>x.id==id);if(f&&!meal.some(x=>x.id==id))meal.push(f);$('#modal').classList.remove('show');mealRender();page('meal')}function addByName(){let q=$('#mealQ').value.trim(),f=foods.find(x=>x.name==q)||foods.find(x=>x.name.includes(q));if(!f)return alert('未找到该食品。');if(!meal.some(x=>x.id==f.id))meal.push(f);$('#mealQ').value='';mealRender()}function mealRender(){$('#mealList').innerHTML=meal.map(f=>`<div class="meal-row"><div><b>${esc(f.name)}</b><div class="muted">${riskText[f.risk]}风险</div></div><button class="btn" onclick="removeMeal('${f.id}')">移除</button></div>`).join('');if(!meal.length)return $('#mealResult').textContent='尚未添加食品。';let avg=Math.round(meal.reduce((s,f)=>s+f.risk,0)/meal.length),high=meal.filter(f=>f.risk>=4),tips=[];if(meal.some(f=>['包装饮料','电解质饮料','奶茶咖啡'].includes(f.cat)&&f.risk>=4))tips.push('把高风险饮料换成0糖版本或白水');if(meal.filter(f=>['主食','烘焙','油炸'].includes(f.cat)&&f.risk>=4).length>1)tips.push('本餐高风险淀粉叠加，建议只保留一项并减量');if(!tips.length)tips.push('仍需结合实际份量和个人血糖记录');$('#mealResult').innerHTML=`<h3>本餐相对风险：<span style="color:${color(avg)}">${'★'.repeat(avg)}${'☆'.repeat(5-avg)}</span></h3><p>较高风险：${high.length?high.map(f=>esc(f.name)).join('、'):'未发现'}</p><ul>${tips.map(t=>`<li>${t}</li>`).join('')}</ul>`}function removeMeal(id){meal=meal.filter(x=>x.id!=id);mealRender()}function exportData(){let b=new Blob([JSON.stringify(recs(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='阿瑾餐后血糖记录.json';a.click()}function importData(f){let r=new FileReader();r.onload=()=>{try{let a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;save(a);renderRec()}catch{alert('文件格式不正确')}};r.readAsText(f)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));$('#searchBtn').onclick=render;$('#q').oninput=render;$('#close').onclick=()=>$('#modal').classList.remove('show');$('#saveRecord').onclick=saveRec;$('#exportBtn').onclick=exportData;$('#importFile').onchange=e=>e.target.files[0]&&importData(e.target.files[0]);$('#mealAdd').onclick=addByName;$('#clearMeal').onclick=()=>{meal=[];mealRender()};$('#foodNames').innerHTML=foods.map(f=>`<option value="${esc
