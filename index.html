<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿瑾的健康助手</title><style>
:root{--p:#147766;--bg:#f2f7f6;--ink:#17332e;--muted:#67817b;--line:#d9e8e4;--lo:#168652;--mi:#bd7a00;--hi:#c83d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.app{max-width:1100px;margin:auto;padding:16px 16px 80px}.hero{background:linear-gradient(135deg,#116755,#20a293);color:#fff;padding:26px;border-radius:24px}.hero h1{margin:0;font-size:clamp(28px,5vw,44px)}.hero p{margin:7px 0}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#fff;padding:7px;border-radius:16px;margin:14px 0;position:sticky;top:7px;z-index:5;box-shadow:0 7px 20px #17332e19}.nav button,.btn{border:0;border-radius:11px;padding:11px;background:transparent;color:var(--muted);font-weight:700}.nav .on,.btn{background:#daf2ed;color:var(--p)}.page{display:none}.page.on{display:block}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;margin-top:13px}.search{display:grid;grid-template-columns:1fr auto;gap:8px}.search input,input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.filters{display:flex;gap:7px;overflow:auto;padding:12px 0}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 11px;color:var(--muted)}.filter.on{background:#daf2ed;color:var(--p);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.card{border:1px solid var(--line);border-left:5px solid var(--risk);border-radius:16px;padding:15px}.card h3{margin:7px 0}.risk{color:var(--risk);font-weight:800}.stars{font-size:24px;color:var(--risk)}.muted{color:var(--muted);font-size:13px;line-height:1.6}.actions{display:flex;gap:7px;margin-top:10px}.btn{cursor:pointer}.empty{text-align:center;padding:25px;color:var(--muted)}.notice{background:#fff7e5;border-left:4px solid #e7a62d;padding:13px;border-radius:12px;margin-top:13px;font-size:13px;line-height:1.6}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.box{background:#eef8f6;border-radius:13px;padding:13px;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#102c2770;z-index:20;align-items:end;justify-content:center}.modal.on{display:flex}.sheet{background:#fff;width:min(650px,100%);padding:22px;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}@media(max-width:620px){.app{padding:10px 10px 75px}.search{grid-template-columns:1fr}.nav{position:fixed;left:10px;right:10px;top:auto;bottom:8px}.nav button{font-size:12px}}</style></head><body><main class="app"><header class="hero"><h1>阿瑾的健康助手</h1><p>阿瑾乖宝的健康第一！！</p></header><nav class="nav"><button class="on" data-p="foods">食品查询</button><button data-p="meal">餐食评估</button><button data-p="tools">健康工具</button></nav><section id="foods" class="page on"><div class="panel"><div class="search"><input id="q" placeholder="搜索奶茶、火锅、面包、蛋糕、品牌食品……"><button class="btn" id="go">查询</button></div><div class="filters" id="filters"></div><div class="grid" id="list"></div></div><div class="notice"><b>重要：</b>复合食品通常没有可靠的单一 GI。本助手显示的是教育性的相对升糖风险，不是个人餐后1小时或2小时的固定血糖数值。实际反应受份量、配方、用药、活动及个体代谢影响。</div></section><section id="meal" class="page"><div class="panel"><h2>组合餐食评估</h2><div id="mealList"></div><div id="summary" class="box">尚未添加食品。</div></div></section><section id="tools" class="page"><div class="panel"><h2>GL估算</h2><p class="muted">GL = GI × 本份可利用碳水（克）÷100，仅用于比较。</p><div class="search"><input id="gi" type="number" placeholder="GI"><input id="carb" type="number" placeholder="碳水克数"><button class="btn" id="calc">计算</button></div><div id="out" class="box">请输入数值。</div></div><div class="panel"><h2>数据说明</h2><p class="muted">低GI≤55，中GI 56–69，高GI≥70。品牌饮品和复合餐食没有统一、可靠的固定GI，因此采用1至5星相对风险，并在详情中标明影响因素。</p></div></section></main><div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><div id="details"></div></div></div><script>const DATA=[{"name":"橙C美式（瑞幸）","cat":"饮料","risk":3,"why":"橙汁或橙味基底中的糖和碳水","tip":"选不额外加糖，避免同时搭配甜点","note":"品牌配方会调整，以当期营养信息为准","keys":["橙C","瑞幸","美式"],"id":"f0"},{"name":"兰香青柠（爷爷不泡茶）","cat":"饮料","risk":4,"why":"糖浆或果汁基底","tip":"选无糖或最低糖、小杯、不加料","note":"糖度和门店配方会改变风险","keys":["兰香","青柠","爷爷不泡茶"],"id":"f1"},{"name":"伯牙绝弦（霸王茶姬）","cat":"饮料","risk":4,"why":"奶基底与可能添加的糖","tip":"选无糖或最低糖，不加珍珠奶盖","note":"实际糖和碳水以品牌信息为准","keys":["霸王茶姬","伯牙绝弦"],"id":"f2"},{"name":"桂馥兰香（霸王茶姬）","cat":"饮料","risk":4,"why":"奶基底与可能添加的糖","tip":"选无糖或最低糖、小杯","note":"不同糖度和配方会改变风险","keys":["霸王茶姬","桂馥兰香"],"id":"f3"},{"name":"多肉葡萄（喜茶）","cat":"饮料","risk":5,"why":"葡萄果肉、果汁基底和糖浆","tip":"小杯、最低糖、不要搭配甜品","note":"水果茶不等于低糖","keys":["喜茶","葡萄"],"id":"f4"},{"name":"芝芝莓莓","cat":"饮料","risk":5,"why":"水果基底、糖和芝士奶盖","tip":"最低糖，去奶盖或减量","note":"品牌和杯型差异大","keys":["草莓茶"],"id":"f5"},{"name":"烤黑糖波波牛乳","cat":"饮料","risk":5,"why":"黑糖、珍珠和奶基底","tip":"小杯、去波波、最低糖","note":"降低糖度后珍珠仍含淀粉","keys":["黑糖珍珠"],"id":"f6"},{"name":"柠檬水（蜜雪冰城）","cat":"饮料","risk":5,"why":"标准配方中的糖浆","tip":"无糖或最低糖，避免大杯","note":"风险主要来自糖浆","keys":["蜜雪冰城","柠檬水"],"id":"f7"},{"name":"厚乳拿铁（瑞幸）","cat":"饮料","risk":4,"why":"厚乳、乳糖及可能添加的糖","tip":"不另外加糖，不搭配甜面包","note":"版本和杯型配方不同","keys":["瑞幸","厚乳"],"id":"f8"},{"name":"丝绒拿铁（瑞幸）","cat":"饮料","risk":4,"why":"奶基底和可能添加的糖","tip":"不额外加糖，避免同时吃蛋糕","note":"以品牌营养信息为准","keys":["瑞幸","丝绒"],"id":"f9"},{"name":"焦糖玛奇朵","cat":"饮料","risk":5,"why":"焦糖糖浆、牛奶和淋酱","tip":"小杯，减少糖浆和淋酱","note":"定制会显著改变糖量","keys":["星巴克","焦糖咖啡"],"id":"f10"},{"name":"珍珠奶茶","cat":"饮料","risk":5,"why":"糖、珍珠淀粉和奶基底","tip":"小杯、最低糖、去珍珠","note":"无糖不代表珍珠无碳水","keys":["奶茶","波霸"],"id":"f11"},{"name":"杨枝甘露","cat":"饮料","risk":5,"why":"糖浆、水果、椰奶和西米","tip":"小份、少糖、去西米","note":"店铺配方差异明显","keys":["甜品饮料"],"id":"f12"},{"name":"无糖可乐","cat":"饮料","risk":1,"why":"可利用碳水很少","tip":"可偶尔选择，日常仍以水为主","note":"需结合整体饮食判断","keys":["零度可乐"],"id":"f13"},{"name":"炸鸡柳（鸡柳大人）","cat":"油炸","risk":3,"why":"裹粉淀粉、油炸和蘸酱","tip":"控制份量，少甜酱，不配甜饮","note":"规格和裹粉量可能不同","keys":["鸡柳大人","鸡柳"],"id":"f14"},{"name":"炸薯条","cat":"油炸","risk":5,"why":"土豆淀粉、油炸和常见大份量","tip":"选小份，不搭配含糖饮料","note":"品牌及规格差异大","keys":["薯条","fries"],"id":"f15"},{"name":"盐酥鸡","cat":"油炸","risk":4,"why":"裹粉淀粉、油炸和调味","tip":"小份、少甜酱、无糖饮料","note":"油脂可能使峰值延后","keys":["盐酥鸡"],"id":"f16"},{"name":"鸡米花","cat":"油炸","risk":4,"why":"裹粉淀粉和蘸酱","tip":"控制块数，不搭配薯条","note":"份量容易被低估","keys":["鸡米花"],"id":"f17"},{"name":"炸鸡排","cat":"油炸","risk":4,"why":"大面积裹粉、油炸和酱料","tip":"分食，去部分裹粉，不配甜饮","note":"鸡肉不是主要碳水来源","keys":["鸡排"],"id":"f18"},{"name":"炸年糕","cat":"油炸","risk":5,"why":"糯米淀粉、油炸和甜辣酱","tip":"少量，酱料分开","note":"糯米制品需特别留意份量","keys":["年糕"],"id":"f19"},{"name":"油条","cat":"油炸","risk":5,"why":"精制面粉和油炸","tip":"半根至一根，不与粥和甜豆浆叠加","note":"传统早餐容易高碳水叠加","keys":["炸油条"],"id":"f20"},{"name":"麦辣鸡腿堡","cat":"快餐","risk":4,"why":"精制面包、裹粉炸鸡和酱料","tip":"单点，不配薯条和甜饮","note":"品牌复合食品没有可靠单一GI","keys":["麦辣","鸡腿堡","汉堡"],"id":"f21"},{"name":"巨无霸","cat":"快餐","risk":4,"why":"多层精制面包和酱料","tip":"避免套餐叠加，饮料选无糖","note":"配方和份量可能变化","keys":["汉堡","big mac"],"id":"f22"},{"name":"原味鸡","cat":"快餐","risk":2,"why":"少量裹粉，主要需留意油脂和钠","tip":"去部分脆皮，不与高碳水配菜叠加","note":"本身通常不是主要碳水来源","keys":["KFC","炸鸡"],"id":"f23"},{"name":"披萨","cat":"快餐","risk":4,"why":"精制饼底且份数易超量","tip":"先吃蔬菜，控制片数，避免甜饮","note":"饼底厚度和尺寸差异大","keys":["pizza"],"id":"f24"},{"name":"麦辣鸡腿堡套餐","cat":"套餐","risk":5,"why":"汉堡、炸鸡裹粉、薯条和甜饮叠加","tip":"饮料改无糖，去掉或减半薯条","note":"套餐风险高于单个汉堡","keys":["麦辣套餐"],"id":"f25"},{"name":"奶茶加蛋糕套餐","cat":"套餐","risk":5,"why":"液体糖与烘焙糖和淀粉叠加","tip":"二选一，或分享小份并选最低糖","note":"组合餐没有固定餐后血糖值","keys":["下午茶"],"id":"f26"},{"name":"肥牛火锅","cat":"火锅","risk":2,"why":"肥牛碳水少，风险主要来自蘸料和配菜","tip":"少甜蘸料，主食只选一种","note":"脂肪可能让峰值延后","keys":["肥牛"],"id":"f27"},{"name":"毛肚","cat":"火锅","risk":1,"why":"可利用碳水很少","tip":"注意汤底、蘸料和同餐主食","note":"低碳水也要留意钠和油脂","keys":["毛肚火锅"],"id":"f28"},{"name":"虾滑","cat":"火锅","risk":3,"why":"部分产品加入淀粉","tip":"查看配料，控制份量","note":"品牌淀粉比例差异大","keys":["虾滑火锅"],"id":"f29"},{"name":"火锅宽粉","cat":"火锅","risk":5,"why":"红薯粉或其他精制淀粉","tip":"半份，与米饭面条年糕只选一种","note":"浸煮后容易吃多","keys":["宽粉","红薯粉"],"id":"f30"},{"name":"火锅土豆片","cat":"火锅","risk":4,"why":"土豆淀粉","tip":"少量，不与宽粉方便面叠加","note":"厚度、煮制和份量影响反应","keys":["土豆片"],"id":"f31"},{"name":"火锅年糕","cat":"火锅","risk":5,"why":"糯米淀粉","tip":"少量，不与其他主食叠加","note":"小份也可能含较多碳水","keys":["年糕火锅"],"id":"f32"},{"name":"火锅方便面","cat":"火锅","risk":5,"why":"精制面条且常与其他主食叠加","tip":"尽量不加，或分食半份","note":"整餐风险还受汤底食材影响","keys":["泡面"],"id":"f33"},{"name":"白吐司","cat":"烘焙","risk":5,"why":"精制小麦粉","tip":"控制片数，搭配鸡蛋和蔬菜","note":"厚度和品牌份量不同","keys":["吐司","白面包"],"id":"f34"},{"name":"全麦吐司","cat":"烘焙","risk":3,"why":"仍含较多碳水，部分产品全麦比例低","tip":"选配料表前列为全麦粉的产品","note":"全麦风味不等于高比例全麦","keys":["全麦面包"],"id":"f35"},{"name":"酸种面包","cat":"烘焙","risk":3,"why":"面粉碳水为主","tip":"控制份量，搭配蛋白质和蔬菜","note":"发酵和配方差异大","keys":["酸面包","sourdough"],"id":"f36"},{"name":"贝果","cat":"烘焙","risk":4,"why":"面团紧实，单个面粉量通常较多","tip":"半个或迷你款，夹蛋和蔬菜","note":"低脂不代表低碳水","keys":["bagel"],"id":"f37"},{"name":"可颂","cat":"烘焙","risk":4,"why":"精制面粉和黄油","tip":"原味小份，不搭配甜饮","note":"油脂可能延后血糖峰值","keys":["牛角包","croissant"],"id":"f38"},{"name":"菠萝包","cat":"烘焙","risk":5,"why":"甜面包胚、酥皮糖和油脂","tip":"分半，不夹黄油，不配奶茶","note":"名称通常不代表含菠萝","keys":["菠萝面包"],"id":"f39"},{"name":"肉松面包","cat":"烘焙","risk":5,"why":"甜面包胚和肉松酱","tip":"半个或小份，选少酱款","note":"肉松不能抵消面包碳水","keys":["肉松包"],"id":"f40"},{"name":"豆沙面包","cat":"烘焙","risk":5,"why":"精制面粉和加糖豆沙","tip":"小份，与他人分食","note":"红豆馅可能含较多添加糖","keys":["红豆面包"],"id":"f41"},{"name":"麻薯面包","cat":"烘焙","risk":4,"why":"糯米粉或木薯淀粉与面粉","tip":"控制个数，不配甜饮","note":"小个不代表低碳水","keys":["麻薯","山姆麻薯"],"id":"f42"},{"name":"肉桂卷","cat":"烘焙","risk":5,"why":"甜面团和糖霜","tip":"分食，去部分糖霜","note":"品牌尺寸差异大","keys":["cinnamon roll"],"id":"f43"},{"name":"脏脏包","cat":"烘焙","risk":5,"why":"酥皮面团、巧克力和糖","tip":"少量，不配含糖饮料","note":"油脂和糖均较高","keys":["巧克力可颂"],"id":"f44"},{"name":"戚风蛋糕","cat":"烘焙","risk":4,"why":"面粉和糖","tip":"小块，并计入碳水","note":"无奶油不代表无糖","keys":["戚风"],"id":"f45"},{"name":"奶油生日蛋糕","cat":"烘焙","risk":5,"why":"蛋糕胚、糖和奶油","tip":"小块，减少奶油，不配甜饮","note":"油脂可能使峰值延后","keys":["生日蛋糕","奶油蛋糕"],"id":"f46"},{"name":"芝士蛋糕","cat":"烘焙","risk":4,"why":"糖、饼底和奶酪","tip":"小份，与他人分食","note":"高脂配方可能延迟血糖变化","keys":["cheesecake"],"id":"f47"},{"name":"提拉米苏","cat":"烘焙","risk":4,"why":"糖、手指饼干和奶酪","tip":"小份，不同时饮用甜咖啡","note":"配方和份量差异大","keys":["tiramisu"],"id":"f48"},{"name":"瑞士卷","cat":"烘焙","risk":4,"why":"蛋糕胚、糖和夹心奶油","tip":"切小份，不作为单独早餐","note":"品牌规格差异大","keys":["蛋糕卷","山姆瑞士卷"],"id":"f49"},{"name":"巴斯克蛋糕","cat":"烘焙","risk":4,"why":"奶酪、糖和少量面粉","tip":"小份，避免与奶茶叠加","note":"脂肪可能使峰值延后","keys":["巴斯克"],"id":"f50"},{"name":"千层蛋糕","cat":"烘焙","risk":5,"why":"多层饼皮、奶油和糖","tip":"少量分食，不搭配甜饮","note":"层数多且份量容易偏大","keys":["千层"],"id":"f51"},{"name":"蛋挞","cat":"烘焙","risk":4,"why":"酥皮、糖和蛋奶馅","tip":"一次一个以内并计入碳水","note":"品牌和尺寸差异大","keys":["葡式蛋挞"],"id":"f52"},{"name":"甜甜圈","cat":"烘焙","risk":5,"why":"精制面粉、糖和油炸","tip":"偶尔小份，不配含糖咖啡","note":"夹心与糖霜增加风险","keys":["donut"],"id":"f53"},{"name":"羊肉串","cat":"烧烤","risk":1,"why":"肉类本身碳水少","tip":"少甜酱，搭配蔬菜","note":"仍需留意脂肪和钠","keys":["烤羊肉串"],"id":"f54"},{"name":"烤鸡翅","cat":"烧烤","risk":2,"why":"甜腌料或蜂蜜刷酱可能增加糖","tip":"少甜酱，选择原味","note":"腌料差异大","keys":["鸡翅烧烤"],"id":"f55"},{"name":"烤面筋","cat":"烧烤","risk":4,"why":"面筋制品和甜咸酱料","tip":"控制串数，少酱","note":"产品可能混入面粉或淀粉","keys":["面筋"],"id":"f56"},{"name":"烤冷面","cat":"烧烤","risk":5,"why":"冷面片和甜酱","tip":"半份、少酱、多加蛋和蔬菜","note":"香肠不能降低面片碳水","keys":["东北烤冷面"],"id":"f57"},{"name":"炒饭","cat":"中式餐食","risk":5,"why":"米饭份量大、油脂和配菜少","tip":"半份米饭，加蔬菜和蛋白质","note":"米种和炒制影响反应","keys":["扬州炒饭"],"id":"f58"},{"name":"叉烧饭","cat":"中式餐食","risk":5,"why":"白米饭和甜味叉烧汁","tip":"饭减半，酱汁分开，加青菜","note":"外卖份量因商家而异","keys":["烧腊饭"],"id":"f59"},{"name":"白粥","cat":"中式餐食","risk":5,"why":"米粒煮得软烂","tip":"不单独吃粥，搭配蛋豆制品和蔬菜","note":"稠度差异大","keys":["稀饭"],"id":"f60"},{"name":"肠粉","cat":"中式餐食","risk":4,"why":"精制米浆皮和甜咸酱汁","tip":"少酱，增加蛋或瘦肉","note":"馅料和份量改变风险","keys":["布拉肠"],"id":"f61"},{"name":"螺蛳粉","cat":"中式餐食","risk":4,"why":"米粉份量大，配料可能含炸物","tip":"粉减量，多青菜和蛋，少腐竹","note":"门店配方差异大","keys":["米粉"],"id":"f62"},{"name":"炒河粉","cat":"中式餐食","risk":5,"why":"米粉份量大、炒油和酱汁","tip":"半份，加蔬菜和蛋白质","note":"外卖份量通常偏大","keys":["干炒牛河"],"id":"f63"},{"name":"酸辣粉","cat":"中式餐食","risk":5,"why":"红薯粉或其他淀粉粉条","tip":"粉减半，加蔬菜蛋白质","note":"整碗粉条碳水容易低估","keys":["酸辣粉"],"id":"f64"},{"name":"饭团","cat":"便利店","risk":4,"why":"米饭为主，部分馅料含甜酱","tip":"选小份，搭配无糖奶或鸡蛋","note":"馅料和大小差异明显","keys":["三角饭团"],"id":"f65"},{"name":"三明治","cat":"便利店","risk":4,"why":"吐司和酱料","tip":"全麦、少酱、蛋或鸡胸肉馅","note":"品牌碳水差异明显","keys":["便利店三明治"],"id":"f66"},{"name":"关东煮萝卜","cat":"便利店","risk":1,"why":"非淀粉蔬菜，碳水较低","tip":"可搭配蛋和豆腐，少喝汤","note":"汤底钠较高","keys":["关东煮"],"id":"f67"},{"name":"白米饭","cat":"主食","risk":5,"why":"精制米饭","tip":"小碗，搭配大量蔬菜和蛋白质","note":"品种及烹饪影响GI","keys":["米饭"],"id":"f68"},{"name":"糙米饭","cat":"主食","risk":3,"why":"仍含较多碳水","tip":"控制份量，与豆类蔬菜蛋白质搭配","note":"不是不限量","keys":["糙米"],"id":"f69"},{"name":"燕麦片","cat":"主食","risk":2,"why":"碳水为主，加工程度不同","tip":"无糖、较少加工，避免蜂蜜果干","note":"即食与钢切反应不同","keys":["燕麦粥"],"id":"f70"},{"name":"苹果","cat":"水果","risk":2,"why":"天然糖，整果含纤维","tip":"整果不榨汁，按一份水果摄入","note":"个体反应和果实大小不同","keys":["apple"],"id":"f71"},{"name":"西瓜","cat":"水果","risk":3,"why":"GI偏高但单份碳水取决于份量","tip":"控制份量，避免一大盘","note":"不要只看GI","keys":["watermelon"],"id":"f72"},{"name":"鸡蛋","cat":"其他","risk":1,"why":"可利用碳水很少","tip":"作为蛋白质搭配，烹饪少油","note":"低碳水不代表其他营养无需关注","keys":["egg"],"id":"f73"},{"name":"西兰花","cat":"其他","risk":1,"why":"非淀粉蔬菜，碳水较低","tip":"适合作为餐盘蔬菜部分","note":"酱汁可能增加糖和钠","keys":["花椰菜"],"id":"f74"}];const cats=['全部','饮料','油炸','快餐','套餐','火锅','烘焙','烧烤','中式餐食','便利店','主食','水果','其他'];let cat='全部',meal=[],$=s=>document.querySelector(s),risk=['','很低','较低','中等','较高','高'];function color(r){return r<=2?'var(--lo)':r==3?'var(--mi)':'var(--hi)'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function filters(){ $('#filters').innerHTML=cats.map(c=>`<button class="filter ${c==cat?'on':''}" data-c="${c}">${c}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{cat=b.dataset.c;filters();render()})}function match(f,q){return [f.name,f.cat,f.why,...f.keys].join(' ').toLowerCase().includes(q.toLowerCase())}function render(){let q=$('#q').value.trim(),a=DATA.filter(f=>(cat=='全部'||f.cat==cat)&&(!q||match(f,q)));$('#list').innerHTML=a.length?a.map(f=>`<article class="card" style="--risk:${color(f.risk)}"><div class="risk">${risk[f.risk]}升糖风险</div><h3>${esc(f.name)}</h3><div class="stars">${'★'.repeat(f.risk)}<span style="color:#dbe4e2">${'★'.repeat(5-f.risk)}</span></div><p class="muted">${esc(f.why)}</p><div class="actions"><button class="btn" onclick="detail('${f.id}')">详情</button><button class="btn" onclick="add('${f.id}')">加入本餐</button></div></article>`).join(''):'<div class="empty">未找到，可尝试更短关键词。</div>'}function detail(id){let f=DATA.find(x=>x.id==id);$('#details').innerHTML=`<div class="risk" style="--risk:${color(f.risk)}">${risk[f.risk]}升糖风险</div><h2>${esc(f.name)}</h2><h3>主要风险来源</h3><p>${esc(f.why)}</p><h3>更稳妥的吃法</h3><p>${esc(f.tip)}</p><div class="notice">${esc(f.note)}</div>`;$('#modal').classList.add('on')}function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id==id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.p==id))}function add(id){let f=DATA.find(x=>x.id==id);if(!meal.some(x=>x.id==id))meal.push(f);mealRender();page('meal')}function mealRender(){$('#mealList').innerHTML=meal.map(f=>`<div class="row"><div><b>${esc(f.name)}</b><div class="muted">${risk[f.risk]}风险</div></div><button class="btn" onclick="removeMeal('${f.id}')">移除</button></div>`).join('');if(!meal.length){$('#summary').textContent='尚未添加食品。';return}let hi=meal.filter(x=>x.risk>=4).length,avg=Math.round(meal.reduce((s,x)=>s+x.risk,0)/meal.length);$('#summary').innerHTML=`<b>组合风险：${risk[avg]}</b><br><span class="muted">${hi>=2?'含多个较高风险项目，优先去掉甜饮或油炸主食，并增加非淀粉蔬菜。':hi==1?'控制高风险食品份量，搭配蔬菜和蛋白质。':'仍需结合实际份量和个人血糖反应。'}</span>`}function removeMeal(id){meal=meal.filter(x=>x.id!=id);mealRender()}$('#go').onclick=render;$('#q').oninput=render;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.p));$('#close').onclick=()=>$('#modal').classList.remove('on');$('#modal').onclick=e=>{if(e.target.id=='modal')$('#modal').classList.remove('on')};$('#calc').onclick=()=>{let g=+$('#gi').value,c=+$('#carb').value;if(g<0||g>100||c<0||!$('#gi').value||!$('#carb').value){$('#out').textContent='请输入有效的GI（0–100）和碳水克数。';return}$('#out').innerHTML=`估算GL：<b>${(g*c/100).toFixed(1)}</b>`};filters();render();mealRender();</script></body></html>
